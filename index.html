  :root{
    --ving-yellow:#FEE413; --ving-ink:#231F20;
    --bg:#F2F0EA; --fg:#231F20; --card:#FFFFFF; --muted:#6E6A65;
    --hairline:#DCD8CF; --surface-2:#EAE7E0; --on-yellow:#231F20;
    --accent-surface:#FFF8CC;
    --success:#1B7A3D; --success-surface:#DDF0E2;
    --alert:#A8560C; --alert-surface:#FBEBD5;
    --danger:#B3261E;
    --shadow:0 14px 30px -18px rgb(35 31 32 / 0.35);
    --font-display:'VingDisplay','IBM Plex Sans Thai',system-ui,sans-serif;
    --font-mono:'VingMono','IBM Plex Sans Thai',ui-monospace,monospace;
    --font-body:'IBM Plex Sans Thai',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131211; --fg:#F4F1EA; --card:#1E1C1A; --muted:#9C968D;
      --hairline:#302D29; --surface-2:#26231F; --accent-surface:#3A3407;
      --success:#5FCB84; --success-surface:#14331F;
      --alert:#E8A657; --alert-surface:#3A2708; --danger:#F2B8B5;
      --shadow:0 18px 36px -16px rgb(0 0 0 / 0.7);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--bg); color:var(--fg); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; -webkit-appearance:none; appearance:none;}
  input, select, textarea{-webkit-appearance:none; appearance:none; border-radius:3px;}
  input[type="date"]{min-height:44px;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  @supports (min-height: 100dvh) { #app{min-height:100dvh;} }

  .wordmark{font-family:var(--font-display); font-size:22px; line-height:1; text-transform:uppercase;}
  .label{font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 18px 12px;}
  .brandbox{display:flex; align-items:center; gap:9px;}
  .yellow-tick{width:12px; height:22px; background:var(--ving-yellow); flex:0 0 auto;}
  .link-btn{background:none; border:none; cursor:pointer; padding:7px 2px; font-family:var(--font-mono);
    font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);}
  .link-btn:hover{color:var(--fg);}

  .content{flex:1; padding:4px 18px 28px; display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--card); border:1px solid var(--hairline); border-radius:4px; padding:20px; box-shadow:var(--shadow);}
  .muted{color:var(--muted);} .small{font-size:12.5px;} .center{text-align:center;}
  .stack-gap{display:flex; flex-direction:column; gap:14px;}
  .row-gap{display:flex; gap:10px; flex-wrap:wrap;}
  .wrap-anywhere{overflow-wrap:anywhere;}

  .hero-card{background:var(--ving-yellow); color:var(--ving-ink); border-radius:4px; padding:22px 20px 20px; box-shadow:var(--shadow);}
  .hero-num{font-family:var(--font-display); font-size:76px; line-height:.86; font-variant-numeric:tabular-nums;}
  .hero-unit{font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.7;}
  .hero-name{
    font-family:var(--font-display); font-size:30px; line-height:1.05;
    margin:2px 0 10px; word-break:break-word;
  }
  .hero-next{font-size:13px; margin-top:12px; line-height:1.5;}
  .bar-track{height:10px; background:rgb(35 31 32 / 0.16); margin-top:14px;}
  .bar-fill{height:100%; background:var(--ving-ink); transition:width .45s cubic-bezier(.2,.8,.2,1);}
  .bar-ticks{display:flex; justify-content:space-between; margin-top:5px;}
  .bar-ticks span{font-family:var(--font-mono); font-size:10.5px; opacity:.7;}

  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .field label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);}
  .field input, .field select{font-family:var(--font-body); font-size:16px; padding:11px 12px; border-radius:3px;
    border:1px solid var(--hairline); background:var(--surface-2); color:var(--fg); outline:none; width:100%;}
  .field select{-webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%, calc(100% - 12px) 50%;
    background-size:6px 6px, 6px 6px; background-repeat:no-repeat; padding-right:38px;}
  .field input:focus{border-color:var(--ving-ink);}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .field input:focus{border-color:var(--ving-yellow);} }

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-display);
    font-size:15px; text-transform:uppercase; border:none; border-radius:3px; padding:14px 18px;
    cursor:pointer; width:100%; transition:transform .06s ease, opacity .15s ease;}

  function drawQr(canvas, text, targetPx) {
    var res = QR.encode(text, QR.LEVEL.M);
    // 4 modules of quiet zone is the QR spec minimum; less than that and many
    // scanners fail to lock onto the symbol.
    var n = res.size, border = 4;
    var scale = Math.max(4, Math.ceil((targetPx || 280) / (n + border * 2)));
    var size = (n + border * 2) * scale;
    canvas.width = size; canvas.height = size;
    canvas.style.width = "100%";
    canvas.style.maxWidth = size + "px";
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#231F20";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (res.modules[r][c]) ctx.fillRect((c + border) * scale, (r + border) * scale, scale, scale);
    }
  }

  /* คุยกับ Google Apps Script ข้ามโดเมน
     - ทางหลัก: POST เป็น text/plain (เลี่ยง CORS preflight ที่ Apps Script ตอบไม่ได้)
     - ทางสำรอง: JSONP (แทรกแท็กสคริปต์) ใช้ตอนเน็ตบางที่บล็อก POST ข้ามโดเมน
                 (ใช้ได้เฉพาะคำขอเล็กๆ เพราะข้อมูลไปกับ URL)                */

  var API_URL = (window.VING_CONFIG && window.VING_CONFIG.apiUrl) || "";
  var jsonpN = 0;

  function jsonp(fn, args) {
    return new Promise(function (resolve, reject) {
      var cb = "vingcb" + (++jsonpN) + "_" + Date.now();
      var url = API_URL + (API_URL.indexOf("?") < 0 ? "?" : "&") +
        "fn=" + encodeURIComponent(fn) +
        "&args=" + encodeURIComponent(JSON.stringify(args || [])) +
        "&callback=" + cb;
      if (url.length > 7000) { reject(new Error("ข้อมูลใหญ่เกินไปสำหรับช่องทางสำรอง")); return; }
      var s = document.createElement("script");
      var done = false;
      var timer = setTimeout(function () { finish(new Error("เซิร์ฟเวอร์ไม่ตอบ")); }, 25000);
      function finish(err, val) {
        if (done) return; done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
        err ? reject(err) : resolve(val);
      }
      window[cb] = function (j) {
        if (j && j.ok) finish(null, j.data);
        else finish(new Error((j && j.error) || "เกิดข้อผิดพลาด"));
      };
      s.onerror = function () { finish(new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้")); };
      s.src = url;
      document.head.appendChild(s);
    });
  }

  function call(fn, args) {
    if (!API_URL) {
      return Promise.reject(new Error("ยังไม่ได้ตั้งค่าลิงก์เซิร์ฟเวอร์ (แก้ไฟล์ config.js)"));
    }
    return fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ fn: fn, args: args || [] }),
      redirect: "follow"
    }).then(function (r) {
      if (!r.ok) throw new Error("เซิร์ฟเวอร์ตอบผิดพลาด (" + r.status + ")");
      return r.text();
    }).then(function (txt) {
      var j;
      try { j = JSON.parse(txt); }
      catch (e) { throw new Error("เซิร์ฟเวอร์ตอบมาไม่ถูกรูปแบบ — ตรวจว่า Deploy เป็น Anyone แล้วหรือยัง"); }
      if (!j.ok) throw new Error(j.error || "เกิดข้อผิดพลาด");
      return j.data;
    }).catch(function (e) {
      // เชื่อมต่อไม่ได้เลย (เน็ตหลุด / โดนบล็อก) -> ลองช่องทางสำรอง
      if (e instanceof TypeError) return jsonp(fn, args);
      throw e;
    });
  }

     จึงเก็บ id ไว้ในตัวแปรหน่วยความจำเป็นหลัก แล้วค่อยพยายามเขียนลง storage
     เป็นของแถม ถ้าเขียนไม่ได้ก็ยังใช้งานต่อได้จนกว่าจะปิดแท็บ                */
  var memId = "";

    if (memId) return memId;

    if (memId) return memId;
    try { memId = localStorage.getItem(LS_ID) || ""; } catch (e) {}
    return memId;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];

  function fmtDate(v) {
    if (!v) return "";
    try {
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" });
    } catch (e) { return String(v); }
  }
  function fmtDateTime(v) {
    if (!v) return "";
    try {
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleDateString("th-TH", { day: "numeric", month: "short" }) + " " +
             d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น.";
    } catch (e) { return String(v); }
  }

  /**
   * ย่อรูปก่อนส่งขึ้นเซิร์ฟเวอร์
   * เซลล์ Google Sheets เก็บได้ ~50,000 ตัวอักษร จึงต้องย่อให้เล็กพอ
   * ไล่ลดคุณภาพลงเรื่อยๆ จนกว่าจะพอดี
   */
  /**
   * ย่อรูป + ใส่กรอบให้เป็นอัตราส่วน 4:3 เท่ากันทุกรูป
   * รูปจะถูกย่อให้ "เห็นเต็มภาพ" (contain) แล้วเติมพื้นขาวส่วนที่เหลือ
   * ไม่ครอปทิ้ง ไม่ว่าจะอัปรูปแนวตั้ง แนวนอน หรือจัตุรัส
   * เซลล์ Google Sheets เก็บได้ ~50,000 ตัวอักษร จึงต้องบีบให้พอดีด้วย
   */
  /** ย่อรูปหน้าเป็นจัตุรัส ครอปตรงกลาง — อวาตาร์กลมจะได้ไม่บิด */
  function shrinkSquare(file, size) {
    size = size || 360;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("อ่านไฟล์ไม่ได้")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("ไฟล์นี้ไม่ใช่รูปภาพ")); };
        img.onload = function () {
          if (!img.width || !img.height) { reject(new Error("รูปเสียหาย")); return; }
          var cv = document.createElement("canvas");
          cv.width = size; cv.height = size;
          var cx = cv.getContext("2d");
          cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, size, size);
          var side = Math.min(img.width, img.height);
          cx.imageSmoothingQuality = "high";
          cx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
          var q = 0.7, out = cv.toDataURL("image/jpeg", q);
          while (out.length > 30000 && q > 0.3) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
          if (out.length > 30000) { reject(new Error("รูปใหญ่เกินไป ลองถ่ายใหม่")); return; }
          resolve(out);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function shrinkImage(file) {
    var BOX_W = 640, BOX_H = 480;   // 4:3
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("อ่านไฟล์ไม่ได้")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("ไฟล์นี้ไม่ใช่รูปภาพ")); };
        img.onload = function () {
          if (!img.width || !img.height) { reject(new Error("รูปเสียหาย")); return; }

          var cv = document.createElement("canvas");
          cv.width = BOX_W; cv.height = BOX_H;
          var cx = cv.getContext("2d");
          cx.fillStyle = "#ffffff";
          cx.fillRect(0, 0, BOX_W, BOX_H);

          // scale แบบ contain — ด้านที่ยาวกว่าชนขอบ อีกด้านเหลือพื้นขาว
          var scale = Math.min(BOX_W / img.width, BOX_H / img.height);
          var w = Math.round(img.width * scale);
          var h = Math.round(img.height * scale);
          cx.imageSmoothingQuality = "high";
          cx.drawImage(img, Math.round((BOX_W - w) / 2), Math.round((BOX_H - h) / 2), w, h);

          var q = 0.72, out = cv.toDataURL("image/jpeg", q);
          while (out.length > 44000 && q > 0.3) {
            q -= 0.1;
            out = cv.toDataURL("image/jpeg", q);
          }
          if (out.length > 44000) { reject(new Error("รูปใหญ่เกินไป ลองใช้รูปอื่น")); return; }
          resolve(out);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /** กล่องยืนยัน — คืน Promise(true/false) ใช้แทน confirm() ของเบราว์เซอร์ */
  function confirmBox(opts) {
    return new Promise(function (resolve) {
      var bg = document.createElement("div");
      bg.className = "modal-bg";
      bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="label">' + esc(opts.label || "ยืนยัน") + "</div>" +

        '<button class="btn btn-danger" data-yes="1">' + esc(opts.okText || "ลบ") + "</button>" +
        "</div></div>";
      document.body.appendChild(bg);

      function done(v) {
        if (bg.parentNode) bg.parentNode.removeChild(bg);
        document.removeEventListener("keydown", onKey);
        resolve(v);
      }
      function onKey(e) { if (e.key === "Escape") done(false); }

      bg.querySelector("[data-no]").addEventListener("click", function () { done(false); });

      document.addEventListener("keydown", onKey);
      bg.querySelector("[data-no]").focus();
    });
  }

    if (!toastEl) { toastEl = document.createElement("div"); toastEl.className = "toast"; document.body.appendChild(toastEl); }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 3000);

    if (on) { el.dataset.old = el.textContent; el.disabled = true; el.textContent = text || "กำลังทำงาน…"; }
    else { el.disabled = false; if (el.dataset.old) el.textContent = el.dataset.old; }

  /**

  /* งานที่ต้องเก็บกวาดเมื่อเปลี่ยนหน้า (เช่น ปิดกล้องที่เปิดค้างไว้)
     render() จะล้างหน้าจอทิ้งทุกครั้ง จึงต้องสั่งปิดของเดิมก่อนวาดใหม่ */
  var leaveHooks = [];
  function onLeave(fn) { leaveHooks.push(fn); }
  function runLeaveHooks() {
    var hs = leaveHooks; leaveHooks = [];
    hs.forEach(function (f) { try { f(); } catch (e) {} });
  }

  function render() {
    runLeaveHooks();
    if (V.poster) return renderPoster();
    if (V.present) return renderPresent();
    if (V.screen === "staff") return renderStaff();
    if (!S) { showLoading(); return; }
    if (!S.runner) return renderJoin();
    if (V.screen === "checkin" && BOOT.eventCode) return renderCheckin();
    if (V.screen === "scan") return renderScan();
    if (V.screen === "profile") return renderProfile();
    return renderCard();
  }

  /* ---------- เข้าใช้งาน: ถามเบอร์ก่อนเสมอ ----------
     เบราว์เซอร์บางตัว (โดยเฉพาะ iPhone) บล็อก localStorage ใน iframe ของ
     Apps Script ทำให้จำเครื่องไม่ได้ จึงใช้ "เบอร์โทร" เป็นตัวยืนยันตัวตนหลัก
     เบอร์เดิม = บัตรใบเดิมเสมอ ไม่มีทางกลายเป็นสมาชิกใหม่                     */

  function renderJoin() {
    var ev = S.event;
    var evNote = ev
      ? '<div class="note" style="margin-top:12px;">เข้าใช้งานแล้วจะเช็คอิน <b>' + esc(ev.name) + "</b> ให้ทันที</div>"
      : "";
    var evErr = (BOOT.eventCode && !ev)
      ? '<div class="err" style="margin-top:12px;">QR นี้ใช้ไม่ได้แล้ว (ปิดหรือไม่พบกิจกรรม) — แจ้งทีมงานหน้างาน</div>'
      : "";

    app.innerHTML = topbar({ staff: true }) +
      '<div class="content"><div class="card">' +
      '<div class="label">เข้าใช้งาน</div>' +
      '<h2 style="font-family:var(--font-display); font-size:27px; text-transform:uppercase; margin-top:8px; line-height:1;">Ving Run Club</h2>' +
      '<p class="muted small" style="margin-top:10px; line-height:1.7;">ใส่เบอร์โทรของคุณ — ถ้าเคยสะสมไว้แล้ว แต้มจะกลับมาครบ ไม่ต้องตั้งรหัสผ่าน</p>' +
      evNote + evErr +
      '<div class="field" style="margin-top:18px;"><label>เบอร์โทร</label>' +
      '<input id="j-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08x-xxx-xxxx" maxlength="15"></div>' +
      '<div id="name-wrap" hidden><div class="field"><label>ชื่อเล่น (สมาชิกใหม่)</label>' +
      '<input id="j-name" type="text" autocomplete="nickname" placeholder="เช่น เอ, พลอย, ต้น" maxlength="40"></div></div>' +
      '<button class="btn btn-yellow" id="j-go">ถัดไป</button>' +
      "</div></div>";

    var phoneEl = document.getElementById("j-phone");
    var nameWrap = document.getElementById("name-wrap");
    var btn = document.getElementById("j-go");
    var stage = "phone";

    async function go() {
      var phone = phoneEl.value.trim();
      if (stage === "phone") {
        busy(btn, true, "กำลังตรวจสอบ…");
        try {
          var r = await call("apiCheckPhone", [phone]);
          if (r.found) {
            setMyId(r.runnerId);
            toast("ยินดีต้อนรับกลับ " + r.name);
            if (BOOT.eventCode) { await doCheckin(); return; }
            await refresh();
            return;
          }
          // ยังไม่เคยสมัคร → ขอชื่อเพิ่ม
          stage = "name";
          nameWrap.hidden = false;
          busy(btn, false);
          btn.textContent = "เริ่มสะสม";
          document.getElementById("j-name").focus();
        } catch (e) { toast(e.message); busy(btn, false); }
        return;
      }

      var name = document.getElementById("j-name").value.trim();
      if (!name) { toast("ใส่ชื่อเล่นก่อนนะ"); return; }
      busy(btn, true, "กำลังสมัคร…");
      try {
        var reg = await call("apiRegister", [name, phone]);
        setMyId(reg.runnerId);
        if (BOOT.eventCode) { await doCheckin(); return; }
        await refresh();
      } catch (e) { toast(e.message); busy(btn, false); }
    }

    btn.addEventListener("click", go);
    phoneEl.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    // แก้เบอร์เมื่อไหร่ ให้กลับไปเช็คใหม่ ไม่งั้นจะสมัครด้วยเบอร์ที่ยังไม่ได้ตรวจ
    phoneEl.addEventListener("input", function () {
      if (stage === "name") { stage = "phone"; nameWrap.hidden = true; btn.textContent = "ถัดไป"; }
    });
  }

  /**
   * วาดป้าย QR ลง canvas สัดส่วน A4 เพื่อเอาไปพิมพ์
   * ทำเป็นรูปเดียวจบ เพราะกดค้าง/คลิกขวาเซฟได้ทุกเครื่อง
   * (การสั่งพิมพ์ตรงจาก iframe ของ Apps Script ไม่แน่นอน)
   */
  function drawPoster(canvas, ev, clubName) {
    var W = 1240, H = 1754;           // A4 ที่ 150dpi
    canvas.width = W; canvas.height = H;
    var x = canvas.getContext("2d");

    x.fillStyle = "#FEE413"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#231F20"; x.fillRect(0, 0, W, 26);
    x.fillRect(0, H - 26, W, 26);

    x.fillStyle = "#231F20";
    x.textAlign = "center";

    x.font = '800 96px VingDisplay, sans-serif';
    x.fillText(String(clubName || "VING RUN CLUB").toUpperCase(), W / 2, 190);

    x.font = '600 40px VingMono, monospace';
    x.fillText("สแกนเพื่อเช็คอิน", W / 2, 262);

    // กล่องขาวรอบ QR
    var qrBox = 700, bx = (W - qrBox) / 2, by = 330;
    x.fillStyle = "#FFFFFF";
    x.fillRect(bx - 26, by - 26, qrBox + 52, qrBox + 52);
    x.strokeStyle = "#231F20"; x.lineWidth = 8;
    x.strokeRect(bx - 26, by - 26, qrBox + 52, qrBox + 52);

    // QR
    var res = QR.encode(eventUrl(ev.code), QR.LEVEL.M);
    var n = res.size, border = 4, unit = qrBox / (n + border * 2);
    x.fillStyle = "#231F20";
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (res.modules[r][c]) {
          x.fillRect(Math.round(bx + (c + border) * unit), Math.round(by + (r + border) * unit),
                     Math.ceil(unit), Math.ceil(unit));
        }
      }
    }

    // รหัสตัวใหญ่ สำหรับคนที่สแกนไม่ติด
    var cy = by + qrBox + 130;
    x.fillStyle = "#231F20";
    x.font = '600 34px VingMono, monospace';
    x.fillText("สแกนไม่ได้? พิมพ์รหัสนี้ในแอป", W / 2, cy - 62);
    x.font = '800 140px VingDisplay, sans-serif';
    x.fillText(String(ev.code), W / 2, cy + 78);

    // ชื่อกิจกรรม + วันที่
    x.font = '700 52px "IBM Plex Sans Thai", sans-serif';
    x.fillText(String(ev.name), W / 2, cy + 190);
    x.font = '400 38px "IBM Plex Sans Thai", sans-serif';
    x.fillText(fmtDate(ev.date) + (ev.limit > 0 ? "  ·  รับ " + ev.limit + " คน" : ""), W / 2, cy + 250);

    x.font = '400 30px "IBM Plex Sans Thai", sans-serif';
    x.fillText("เปิดกล้องมือถือส่องที่ QR ด้านบน", W / 2, H - 90);
  }

  /** ดึงรหัสกิจกรรมออกจากสิ่งที่อ่านได้จาก QR
      รองรับทั้งลิงก์แบบใหม่ (?e=) ลิงก์เก่า (?event=) และป้ายที่เก็บรหัสล้วน */
  function eventCodeFromQr(raw) {
    var s = String(raw == null ? "" : raw).trim();
    var m = s.match(/[?&](?:e|event)=([A-Za-z0-9]+)/i);
    if (m) return m[1].toUpperCase();
    if (/^[A-Za-z0-9]{4,10}$/.test(s)) return s.toUpperCase();
    return "";
  }

  /* โหลดตัวถอดรหัส QR สำรอง (jsQR) เฉพาะตอนที่เครื่องไม่มี BarcodeDetector
     — iPhone/Safari และ Chrome บนคอมไม่มีตัวนี้ ต้องพึ่งตัวสำรอง
     ล็อกไฟล์ด้วย integrity กันไฟล์ถูกสลับกลางทาง                        */
  var JSQR_URL = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
  var JSQR_SRI = "sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx";
  var jsqrPromise = null;

  function loadJsQr() {
    if (window.jsQR) return Promise.resolve(window.jsQR);
    if (jsqrPromise) return jsqrPromise;
    jsqrPromise = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = JSQR_URL;
      s.integrity = JSQR_SRI;
      s.crossOrigin = "anonymous";
      s.onload = function () { window.jsQR ? resolve(window.jsQR) : reject(new Error("no jsQR")); };
      s.onerror = function () { jsqrPromise = null; reject(new Error("load failed")); };
      document.head.appendChild(s);
    });
    return jsqrPromise;
  }

  /**
   * กล้องในแอป — ใช้ได้จริงตั้งแต่ย้ายมาอยู่บนโดเมนตัวเอง (https)
   * เครื่องที่มี BarcodeDetector (Chrome บน Android) ใช้ของในตัวเครื่อง เร็วกว่า
   * เครื่องที่ไม่มี (iPhone/Safari, Chrome บนคอม) จะโหลดตัวถอดรหัสสำรองมาใช้แทน
   */
  function setupCamera(slot) {
    function fallback(title, detail) {
      slot.innerHTML =
        '<div class="cam-fallback">' + ICON_SCAN +
        "<p>" + title + "</p>" +
        '<p class="muted" style="margin-top:8px;">' + detail + "</p></div>";
    }

    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      fallback("เบราว์เซอร์นี้เปิดกล้องในหน้าเว็บไม่ได้ — ใช้ <b>แอปกล้องของมือถือ</b> ส่อง QR บนป้ายแทนได้เลย",
               "หรือพิมพ์รหัส 6 ตัวในช่องด้านบน");
      return;
    }

    slot.innerHTML = '<button class="btn btn-ink" id="cam-start">' + ICON_SCAN + "เปิดกล้องสแกน</button>" +
      '<div id="cam-view" hidden style="margin-top:12px;">' +
      '<video playsinline autoplay muted style="width:100%; border-radius:3px; background:#000;"></video>' +
      '<p class="muted small center" style="margin-top:8px;">เล็ง QR ให้อยู่กลางจอ</p>' +
      '<button class="btn btn-quiet btn-sm" id="cam-stop" style="margin-top:6px;">ปิดกล้อง</button></div>';

    var startBtn = document.getElementById("cam-start");
    var view = document.getElementById("cam-view");
    var video = view.querySelector("video");
    var stream = null, timer = null, canvas = null, ctx = null, hit = false;

    function stop() {
      if (timer) { clearInterval(timer); timer = null; }
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      try { video.srcObject = null; } catch (e) {}
      view.hidden = true; startBtn.hidden = false;
    }
    onLeave(stop);   // ออกจากหน้านี้เมื่อไหร่ ปิดกล้องทันที

    function found(raw) {
      var code = eventCodeFromQr(raw);
      if (!code || hit) return;
      hit = true; stop(); BOOT.eventCode = code; doCheckin();
    }

    /** อ่านเฟรมปัจจุบันด้วยตัวถอดรหัสสำรอง (ย่อภาพก่อนเพื่อไม่ให้หน่วง) */
    function scanFrameWithJsQr() {
      var w = video.videoWidth, h = video.videoHeight;
      if (!w || !h) return;
      var scale = Math.min(1, 480 / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      if (!canvas) { canvas = document.createElement("canvas"); ctx = canvas.getContext("2d", { willReadFrequently: true }); }
      if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
      ctx.drawImage(video, 0, 0, cw, ch);
      var img = ctx.getImageData(0, 0, cw, ch);
      var res = window.jsQR(img.data, cw, ch, { inversionAttempts: "dontInvert" });
      if (res && res.data) found(res.data);
    }

    startBtn.addEventListener("click", async function () {
      busy(startBtn, true, "กำลังเปิดกล้อง…");
      var stopped = false;

      // 1) ขอสิทธิ์กล้องก่อน — ให้ผู้ใช้เห็นป๊อปอัปทันทีที่กด
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } }, audio: false
        });
      } catch (err) {
        busy(startBtn, false);
        var name = (err && err.name) || "";
        if (name === "NotAllowedError" || name === "SecurityError") {
          fallback("คุณกดไม่อนุญาตให้ใช้กล้องไว้",
                   "iPhone: แตะไอคอน <b>ᴀA</b> ซ้ายบนของ Safari → การตั้งค่าเว็บไซต์ → กล้อง → อนุญาต<br>" +
                   "Android: แตะไอคอน 🔒 ข้างช่อง URL → สิทธิ์ → กล้อง → อนุญาต<br>" +
                   "หรือใช้แอปกล้องของมือถือส่อง QR แทนก็ได้ครับ");
        } else if (name === "NotFoundError" || name === "OverconstrainedError") {
          fallback("ไม่พบกล้องบนเครื่องนี้", "ใช้แอปกล้องของมือถือ หรือพิมพ์รหัส 6 ตัวด้านบน");
        } else {
          fallback("เปิดกล้องไม่สำเร็จ", "ใช้แอปกล้องของมือถือส่อง QR บนป้ายแทนได้เลย");
        }
        return;
      }

      video.srcObject = stream;
      try { await video.play(); } catch (e) { /* บางเครื่องเล่นเองอยู่แล้ว */ }
      startBtn.hidden = true; view.hidden = false;
      busy(startBtn, false);

      // 2) เลือกตัวถอดรหัส — ของในตัวเครื่องก่อน ไม่มีค่อยโหลดตัวสำรอง
      if (typeof window.BarcodeDetector !== "undefined") {
        try {
          var detector = new window.BarcodeDetector({ formats: ["qr_code"] });
          timer = setInterval(async function () {
            try {
              var r = await detector.detect(video);
              if (r && r.length) found(r[0].rawValue);
            } catch (e) { /* เฟรมนี้อ่านไม่ได้ ลองเฟรมถัดไป */ }
          }, 300);
          return;
        } catch (e) { /* สร้างไม่สำเร็จ ตกไปใช้ตัวสำรอง */ }
      }

      try {
        await loadJsQr();
      } catch (e) {
        stop(); stopped = true;
        fallback("โหลดตัวอ่าน QR ไม่สำเร็จ (เน็ตอาจไม่เสถียร)",
                 "ใช้แอปกล้องของมือถือส่อง QR บนป้าย หรือพิมพ์รหัส 6 ตัวด้านบน");
      }
      if (stopped || !stream) return;
      timer = setInterval(function () {
        try { scanFrameWithJsQr(); } catch (e) { /* ลองเฟรมถัดไป */ }
      }, 250);
    });

    document.getElementById("cam-stop").addEventListener("click", stop);
  }

  function renderCheckin() {
    var ev = S.event;
    if (!ev) {
      app.innerHTML = topbar({ back: "home", title: "เช็คอิน", staff: false }) +
        '<div class="content"><div class="card center">' +
        '<div class="label">ไม่พบกิจกรรม</div>' +

        '<button class="btn btn-yellow" style="margin-top:16px;" data-nav="scan">ลองอีกครั้ง</button>' +
        '<button class="btn btn-outline" style="margin-top:10px;" data-nav="home">กลับหน้าหลัก</button>' +
        "</div></div>" + bottomNav("scan");
      return;

      app.innerHTML = topbar({ back: "home", title: "เช็คอิน", staff: false }) + '<div class="content">' +

        '<div class="headline">' + esc(ev.name) + "</div>" +
        '<div class="sub">สะสมทั้งหมด ' + S.count + " ครั้ง</div></div>" +
        '<button class="btn btn-ink" data-nav="home">กลับหน้าหลัก</button></div>' + bottomNav("home");

    if (ev.limit > 0) {
      var pctCap = Math.min(100, Math.round((ev.used / ev.limit) * 100));
      cap = '<div class="mono" style="font-size:11.5px; margin-top:12px;">รับได้ ' + ev.used + " / " + ev.limit + " คน</div>" +
        '<div class="cap-bar"><div class="cap-fill' + (pctCap >= 90 ? " hot" : "") + '" style="width:' + pctCap + '%;"></div></div>';

      ? '<div class="err" style="margin-top:16px;">กิจกรรมนี้เต็มแล้ว (รับ ' + ev.limit + ' คน) — แจ้งทีมงานหน้างาน</div>'

  async function doCheckin() {
    try {
      var r = await call("apiCheckin", [myId(), BOOT.eventCode]);
      if (r.hitTier) await prizePopup(r.hitTier, r.hitImage);
      var body;
      if (r.hitTier) {
        body = '<div class="banner"><div class="kicker">ครบ ' + r.hitTier.n + " ครั้ง</div>" +
          '<div class="headline">' + esc(rewardLabel(r.hitTier)) + "</div>" +
          '<div class="sub">แจ้งทีมงานหน้างานเพื่อรับของรางวัล</div></div>';
      } else {
        body = '<div class="banner"><div class="kicker">' + (r.duplicate ? "เช็คอินไปแล้ว" : "เช็คอินสำเร็จ") + "</div>" +
          '<div class="headline">' + r.count + " ครั้ง</div>" +
          '<div class="sub">' + esc(r.eventName) + "<br>" +
          (r.nextTier ? "อีก " + (r.nextTier.n - r.count) + " ครั้ง ครบ " + r.nextTier.n : "ครบทุกระดับแล้ว") + "</div></div>";
      }
      app.innerHTML = topbar({ title: "เช็คอิน", staff: false }) + '<div class="content">' + body +
        '<button class="btn btn-ink" data-nav="home">กลับหน้าหลัก</button></div>' + bottomNav("home");
    } catch (e) {
      toast(e.message);
      BOOT.eventCode = "";
      V.screen = "scan";
      await refresh();

    app.innerHTML = '<div class="present">' +

  /* ===================== staff ===================== */

  function staffShell(inner) {
    return '<div class="topbar"><button class="link-btn" data-nav="home">‹ กลับ</button>' +
      '<span class="wordmark" style="font-size:15px;">Staff</span><span style="width:34px;"></span></div>' +
      '<div class="content">' + inner + "</div>";
  }

  function renderStaff() {
    if (!ST) {
      app.innerHTML = staffShell(
        '<div class="card"><div class="label">เฉพาะทีมงาน</div>' +
        '<h2 style="font-family:var(--font-display); font-size:24px; text-transform:uppercase; margin-top:8px;">Staff access</h2>' +
        '<div class="field" style="margin-top:16px;"><label>รหัสผ่านทีมงาน</label>' +
        '<div class="pw-wrap">' +
        '<input id="pin" type="password" autocomplete="current-password" ' +
        'autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์ได้ทั้งตัวอักษรและตัวเลข">' +
        '<button type="button" class="pw-eye" id="pin-eye" aria-label="แสดงรหัสผ่าน">แสดง</button>' +
        "</div></div>" +
        '<button class="btn btn-yellow" id="pin-go">เข้าสู่ระบบ</button></div>');
      var eye = document.getElementById("pin-eye");
      var pinEl = document.getElementById("pin");
      eye.addEventListener("click", function () {
        var showing = pinEl.type === "text";
        pinEl.type = showing ? "password" : "text";
        eye.textContent = showing ? "แสดง" : "ซ่อน";
        pinEl.focus();
      });

      var go = async function () {
        var btn = document.getElementById("pin-go");
        var v = pinEl.value.trim();
        busy(btn, true, "กำลังตรวจสอบ…");
        try { ST = await call("apiStaffState", [v]); setPin(v); render(); }
        catch (e) { toast(e.message); busy(btn, false); }
      };
      document.getElementById("pin-go").addEventListener("click", go);
      document.getElementById("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
      return;
    }

    var inner =
      '<div class="tabs">' +
      ['events:กิจกรรม', 'tiers:รางวัล', 'runners:นักวิ่ง', 'fix:แก้เช็คอิน'].map(function (t) {
        var p = t.split(":");
        return '<button class="tab-btn' + (V.tab === p[0] ? " active" : "") + '" data-tab="' + p[0] + '">' + p[1] + "</button>";
      }).join("") + "</div>" +
      '<div id="staff-body" class="stack-gap"></div>' +
      '<button class="btn btn-quiet" id="staff-out">ออกจากโหมดทีมงาน</button>';
    app.innerHTML = staffShell(inner);

    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { V.tab = b.getAttribute("data-tab"); render(); });
    });
    document.getElementById("staff-out").addEventListener("click", function () {
      ST = null; setPin(""); V.screen = "home"; render();
    });

    var body = document.getElementById("staff-body");
    if (V.tab === "events") staffEvents(body);
    else if (V.tab === "tiers") staffTiers(body);
    else if (V.tab === "fix") staffFix(body);
    else staffRunners(body);
  }

  }

  function staffEvents(body) {

    link.className = "card";
    link.innerHTML = '<div class="label">ลิงก์แอป (ที่ QR ใช้)</div>' +

      '<div class="mono small wrap-anywhere" style="margin-top:10px; background:var(--surface-2); padding:10px;">' +

      '<div class="row-gap" style="margin-top:10px;">' +
      '<button class="btn btn-outline btn-sm" id="copy-app">คัดลอกลิงก์</button>' +

    mk.className = "card";
    mk.innerHTML = '<div class="label">สร้างกิจกรรม</div><div style="margin-top:14px;">' +

      '<div class="field"><label>วันที่</label><input id="e-date" type="date"></div>' +
      '<div class="field"><label>รับได้กี่คน (0 = ไม่จำกัด)</label>' +

    document.getElementById("e-go").addEventListener("click", async function () {
      var name = document.getElementById("e-name").value.trim();
      if (!name) { toast("ใส่ชื่อกิจกรรมก่อนนะ"); return; }
      busy(this, true, "กำลังสร้าง…");
      try {
        await call("apiCreateEvent", [staffPin, name,
          document.getElementById("e-date").value,
          document.getElementById("e-limit").value]);
        toast("สร้างกิจกรรมแล้ว");
        await reloadStaff();
      } catch (e) { toast(e.message); busy(this, false); }
    });

    if (!ST.events.length) {
      var em = document.createElement("div");
      em.className = "card empty";
      em.textContent = "ยังไม่มีกิจกรรม — สร้างอันแรกด้านบน";
      body.appendChild(em);
      return;
    }

    ST.events.forEach(function (ev) {
      var card = document.createElement("div");
      card.className = "card";
      var capHtml = "";
      if (ev.limit > 0) {
        var pc = Math.min(100, Math.round((ev.count / ev.limit) * 100));
        capHtml = '<div class="mono" style="font-size:11px; margin-top:11px; display:flex; justify-content:space-between;">' +
          "<span>" + ev.count + " / " + ev.limit + " คน</span>" +
          (ev.full ? '<span style="color:var(--danger);">เต็มแล้ว</span>' : "<span>เหลือ " + (ev.limit - ev.count) + "</span>") +
          "</div>" +
          '<div class="cap-bar"><div class="cap-fill' + (pc >= 90 ? " hot" : "") + '" style="width:' + pc + '%;"></div></div>';
      } else {
        capHtml = '<div class="mono muted" style="font-size:11px; margin-top:11px;">ไม่จำกัดจำนวน</div>';
      }

      card.innerHTML =
        '<div class="ev-head"><div><div class="ev-name">' + esc(ev.name) + "</div>" +
        '<div class="ev-meta">' + fmtDate(ev.date) + " · " + esc(ev.code) + "</div></div>" +
        '<span class="chip ' + (ev.full ? "chip-wait" : ev.active ? "chip-ok" : "chip-off") + '">' +
        (ev.full ? "เต็ม" : ev.active ? "เปิด" : "ปิด") + "</span></div>" +
        capHtml +
        '<div class="row-gap" style="margin-top:11px; align-items:center;">' +
        '<input class="cap-input" type="number" inputmode="numeric" min="0" step="1" value="' + ev.limit + '" ' +
        'style="width:86px; font-family:var(--font-body); font-size:16px; padding:8px 10px; border-radius:3px; ' +
        'border:1px solid var(--hairline); background:var(--surface-2); color:var(--fg); font-size:16px;">' +
        '<button class="btn btn-quiet btn-sm" data-limit="' + esc(ev.id) + '">บันทึกจำนวน</button></div>' +
        '<div class="qr-panel" style="margin-top:15px;"><canvas></canvas>' +
        '<div class="qr-code">' + esc(ev.code) + '</div><div class="qr-hint">สแกนเพื่อเช็คอิน</div></div>' +
        '<div class="row-gap" style="margin-top:13px;">' +
        '<button class="btn btn-ink btn-sm" data-present="' + esc(ev.code) + '">แสดงเต็มจอ</button>' +
        '<button class="btn btn-yellow btn-sm" data-poster="' + esc(ev.code) + '">ป้ายพิมพ์</button>' +
        '<button class="btn btn-outline btn-sm" data-copy="' + esc(ev.code) + '">คัดลอกลิงก์</button>' +
        '<button class="btn btn-outline btn-sm" data-toggle="' + esc(ev.id) + '">' + (ev.active ? "ปิดกิจกรรม" : "เปิดใหม่") + "</button></div>";
      body.appendChild(card);
      drawQr(card.querySelector("canvas"), eventUrl(ev.code), 260);
      card.querySelector("[data-present]").addEventListener("click", function () { V.present = ev.code; render(); });
      card.querySelector("[data-poster]").addEventListener("click", function () { V.poster = ev.code; render(); });
      card.querySelector("[data-copy]").addEventListener("click", function () { copy(eventUrl(ev.code)); });
      card.querySelector("[data-toggle]").addEventListener("click", async function () {
        busy(this, true, "…");
        try { await call("apiSetEventActive", [staffPin, ev.id, !ev.active]); await reloadStaff(); }
        catch (e) { toast(e.message); busy(this, false); }
      });
      card.querySelector("[data-limit]").addEventListener("click", async function () {

        try {

          toast(res.limit ? "ตั้งรับได้ " + res.limit + " คน" : "ตั้งเป็นไม่จำกัดแล้ว");
          await reloadStaff();
        } catch (e) { toast(e.message); busy(this, false); }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("คัดลอกแล้ว"); }, function () { toast(text); });
    } else { toast(text); }
  }

  /** ป้ายสรุปสต็อกของรางวัลแต่ละระดับ */
  function stockBadge(t) {
    if (!t || !t.stock) return '<span class="stock-note muted">ไม่ได้นับสต็อก</span>';
    var left = t.left == null ? t.stock : t.left;
    var cls = "chip-ok", txt = "เหลือ " + left + " / " + t.stock;
    if (left <= 0) { cls = "chip-wait"; txt = "หมดแล้ว"; }
    else if (t.short > 0) { cls = "chip-wait"; txt = "เหลือ " + left + " · ไม่พอ " + t.short; }
    else if (left <= t.stock * 0.15) { cls = "chip-wait"; txt = "เหลือ " + left + " (ใกล้หมด)"; }
    return '<span class="chip ' + cls + '">' + txt + "</span>";
  }

  function staffTiers(body) {
    var work = ST.tiers.map(function (t) {
      return { n: t.n, reward: t.reward || "", stock: t.stock || 0 };
    });
    var sum = document.createElement("div");
    sum.className = "card";
    var anyStock = ST.tiers.some(function (t) { return t.stock > 0; });
    sum.innerHTML = '<div class="label">สรุปของรางวัล</div>' +
      (anyStock
        ? '<div class="stock-table">' +
          '<div class="st-head"><span>ระดับ</span><span>แจกแล้ว</span><span>รอแจก</span><span>เหลือ</span></div>' +
          ST.tiers.map(function (t) {
            var left = t.left == null ? "—" : t.left;
            var warn = (t.short > 0 || (t.left != null && t.left <= 0));
            return '<div class="st-row' + (warn ? " warn" : "") + '">' +
              "<span>" + t.n + " ครั้ง · " + esc(t.reward || "") + "</span>" +
              "<span>" + t.given + "</span><span>" + t.waiting + "</span><span>" + left + "</span></div>";
          }).join("") + "</div>" +
          (ST.tiers.some(function (t) { return t.short > 0; })
            ? '<div class="err" style="margin-top:12px;">มีระดับที่ของไม่พอกับคนที่รอรับอยู่ — เพิ่มจำนวน หรือสั่งผลิตเพิ่ม</div>'
            : "")
        : '<p class="small muted" style="margin-top:8px; line-height:1.7;">ใส่จำนวนของที่มีในช่อง «มีของกี่ชิ้น» ด้านล่าง ระบบจะนับให้ว่าเหลือเท่าไหร่ และเตือนตอนใกล้หมด</p>');
    body.appendChild(sum);

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="label">ระดับรางวัล</div>' +
      '<p class="small muted" style="margin:8px 0 14px; line-height:1.7;">ตั้งเองได้ว่ากี่ครั้งได้อะไร แนบรูปของรางวัลได้ด้วย — พอนักวิ่งเช็คอินครบ รูปจะเด้งขึ้นโชว์ทันที</p>' +
      '<div id="rows"></div>' +
      '<button class="btn btn-quiet btn-sm" id="add" style="margin-top:4px;">+ เพิ่มระดับ</button>' +
      '<button class="btn btn-yellow" id="save" style="margin-top:14px;">บันทึกระดับรางวัล</button>';
    body.appendChild(card);

    var rows = card.querySelector("#rows");
    function draw() {
      rows.innerHTML = "";
      work.forEach(function (t, i) {
        var wrap = document.createElement("div");
        wrap.style.cssText = "padding:12px 0; border-top:1px solid var(--hairline);";
        if (i === 0) wrap.style.borderTop = "none";

        var img = (ST.images || {})[String(t.n)] || "";
        wrap.innerHTML =
          '<div class="tier-edit" style="margin-bottom:6px;">' +
          '<input type="number" min="1" value="' + t.n + '" aria-label="จำนวนครั้ง">' +
          '<input type="text" value="' + esc(t.reward) + '" placeholder="ชื่อของรางวัล" aria-label="ชื่อของรางวัล">' +
          '<button class="x-btn" type="button" aria-label="ลบระดับนี้">×</button></div>' +
          '<div class="stock-row">' +
          '<span class="stock-label">มีของกี่ชิ้น</span>' +
          '<input type="number" min="0" class="stock-input" value="' + (t.stock || 0) + '" aria-label="จำนวนของรางวัล">' +
          stockBadge(ST.tiers.filter(function (x) { return x.n === t.n; })[0]) +
          "</div>" +
          '<div class="img-row">' +
          (img ? '<img class="img-prev" src="' + img + '" alt="">'
               : '<div class="img-empty">ไม่มี<br>รูป</div>') +
          '<div style="flex:1; display:flex; gap:8px; flex-wrap:wrap;">' +
          '<button class="file-btn" type="button" data-pick="' + i + '">' + (img ? "เปลี่ยนรูป" : "แนบรูปรางวัล") + "</button>" +
          (img ? '<button class="file-btn" type="button" data-rmimg="' + i + '">ลบรูป</button>' : "") +
          "</div>" +
          '<input type="file" accept="image/*" hidden data-file="' + i + '">' +
          "</div>";

        var ins = wrap.querySelectorAll(".tier-edit input");
        ins[0].addEventListener("input", function () { work[i].n = parseInt(ins[0].value || "0", 10) || 0; });
        ins[1].addEventListener("input", function () { work[i].reward = ins[1].value; });
        var stEl = wrap.querySelector(".stock-input");
        stEl.addEventListener("input", function () { work[i].stock = parseInt(stEl.value || "0", 10) || 0; });
        wrap.querySelector(".x-btn").addEventListener("click", function () { work.splice(i, 1); draw(); });

        var fileEl = wrap.querySelector("[data-file]");
        wrap.querySelector("[data-pick]").addEventListener("click", function () {
          if (!work[i].n) { toast("ใส่จำนวนครั้งของระดับนี้ก่อน"); return; }
          fileEl.click();
        });
        fileEl.addEventListener("change", async function () {
          var f = fileEl.files && fileEl.files[0];
          if (!f) return;
          var btn = wrap.querySelector("[data-pick]");
          busy(btn, true, "กำลังย่อรูป…");
          try {
            var dataUri = await shrinkImage(f);
            btn.textContent = "กำลังอัปโหลด…";
            await call("apiSetTierImage", [staffPin, work[i].n, dataUri]);
            toast("แนบรูปรางวัลระดับ " + work[i].n + " แล้ว");
            await reloadStaff();
          } catch (e) { toast(e.message); busy(btn, false); }
          fileEl.value = "";
        });

        var rm = wrap.querySelector("[data-rmimg]");
        if (rm) rm.addEventListener("click", async function () {
          busy(rm, true, "…");
          try {
            await call("apiSetTierImage", [staffPin, work[i].n, ""]);
            toast("ลบรูปแล้ว");
            await reloadStaff();
          } catch (e) { toast(e.message); busy(rm, false); }
        });

        rows.appendChild(wrap);
      });
    }
    draw();
    card.querySelector("#add").addEventListener("click", function () {
      var last = work[work.length - 1];
      work.push({ n: (last ? last.n : 0) + 3, reward: "", stock: 0 });
      draw();
    });
    card.querySelector("#save").addEventListener("click", async function () {
      busy(this, true, "กำลังบันทึก…");
      try { await call("apiSetTiers", [staffPin, work]); toast("บันทึกแล้ว"); await reloadStaff(); }
      catch (e) { toast(e.message); busy(this, false); }
    });

    var st = document.createElement("div");
    st.className = "card";
    st.innerHTML = '<div class="label">ตั้งค่าทั่วไป</div>' +

  function staffRunners(body) {
    /* ---------- รอแจกของรางวัล ---------- */
    var pend = document.createElement("div");
    pend.className = "card";
    var lowTiers = ST.tiers.filter(function (t) { return t.stock > 0 && t.left != null && t.left <= 0; });
    pend.innerHTML = '<div class="label">รอแจกของรางวัล (' + ST.pending.length + ")</div>" +
      (lowTiers.length
        ? '<div class="err" style="margin-top:10px;">ของหมดสต็อก: ' +
          lowTiers.map(function (t) { return esc(t.reward || ("ระดับ " + t.n)); }).join(", ") +
          " — แจกไม่ได้จนกว่าจะเพิ่มจำนวน</div>"
        : "") +
      (ST.pending.length
        ? '<p class="small muted" style="margin:8px 0 4px; line-height:1.7;">เช็ค <b>รหัสสมาชิก</b> บนมือถือของนักวิ่งให้ตรงก่อนแจก</p>' +
          ST.pending.map(function (p) {
            return '<div class="person-row"><div style="flex:1; min-width:0;">' +
              '<div class="who"><span class="person-name">' + esc(p.name) + "</span>" +
              '<span class="who-code">' + esc(p.code || "—") + "</span>" +
              (p.dupName ? '<span class="dup-flag">ชื่อซ้ำ</span>' : "") + "</div>" +
              '<div class="person-sub">' + esc(p.phone || "ไม่มีเบอร์") + " · ครบ " + p.tierN + " · " + esc(p.reward || ("ระดับ " + p.tierN)) + "</div></div>" +
              (p.hasPhoto ? '<button class="undo-btn" data-photo="' + esc(p.runnerId) + '">ดูรูป</button>' : "") +
              '<button class="btn btn-yellow btn-sm" data-give="' + esc(p.runnerId) + "|" + p.tierN + '">แจกแล้ว</button></div>';
          }).join("")
        : '<div class="empty">ไม่มีของค้างแจก</div>');
    body.appendChild(pend);

    pend.querySelectorAll("[data-photo]").forEach(function (b) {
      b.addEventListener("click", async function () {
        busy(b, true, "…");
        try {
          var res = await call("apiGetRunnerPhoto", [staffPin, b.getAttribute("data-photo")]);
          busy(b, false);
          if (!res.photo) { toast("คนนี้ยังไม่ได้ใส่รูป"); return; }
          showPhoto(res.photo);
        } catch (e) { toast(e.message); busy(b, false); }
      });
    });

    pend.querySelectorAll("[data-give]").forEach(function (b) {
      b.addEventListener("click", async function () {
        var parts = b.getAttribute("data-give").split("|");
        busy(b, true, "…");
        try {
          var res = await call("apiFulfill", [staffPin, parts[0], parseInt(parts[1], 10)]);
          toast("แจก " + (res.reward || "ของรางวัล") + " ให้ " + (res.name || "") + " แล้ว");
          await reloadStaff();
        } catch (e) { toast(e.message); busy(b, false); }
      });
    });

    /* ---------- แจกไปแล้ว ---------- */
    var given = document.createElement("div");
    given.className = "card";
    given.innerHTML = '<div class="label">แจกไปแล้ว (' + ST.given.length + ")</div>" +
      (ST.given.length
        ? ST.given.map(function (g) {
            return '<div class="given-row"><div style="flex:1; min-width:0;">' +
              '<div class="who"><span class="chip chip-ok">✓ แจกแล้ว</span>' +
              '<span class="person-name">' + esc(g.name) + "</span>" +
              '<span class="who-code">' + esc(g.code || "—") + "</span></div>" +
              '<div class="person-sub">' + esc(g.reward) + " · ครบ " + g.tierN + " · " + fmtDateTime(g.ts) + "</div></div>" +
              '<button class="undo-btn" data-undo="' + esc(g.runnerId) + "|" + g.tierN + '">ยกเลิก</button></div>';
          }).join("")
        : '<div class="empty">ยังไม่ได้แจกของรางวัลให้ใคร</div>');
    body.appendChild(given);

    given.querySelectorAll("[data-undo]").forEach(function (b) {
      b.addEventListener("click", async function () {
        var parts = b.getAttribute("data-undo").split("|");
        var ok = await confirmBox({
          label: "ยกเลิกการแจก",
          title: "ยกเลิกรายการนี้?",
          body: "รายการนี้จะกลับไปอยู่ใน <b>รอแจกของรางวัล</b> อีกครั้ง ใช้เมื่อกดแจกผิดคน",
          okText: "ยกเลิกการแจก"
        });
        if (!ok) return;
        busy(b, true, "…");
        try {
          await call("apiUnfulfill", [staffPin, parts[0], parseInt(parts[1], 10)]);
          toast("ยกเลิกแล้ว — กลับไปรอแจก");
          await reloadStaff();
        } catch (e) { toast(e.message); busy(b, false); }
      });
    });

    /* ---------- นักวิ่งทั้งหมด + ค้นหา ---------- */
    var all = document.createElement("div");
    all.className = "card";
    all.innerHTML = '<div class="label">นักวิ่งทั้งหมด (' + ST.runners.length + ")</div>" +
      '<input class="search-box" id="r-search" type="search" placeholder="ค้นหา ชื่อ / เบอร์ / รหัสสมาชิก" ' +
      'autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-top:10px;">' +
      '<div id="r-list"></div>';
    body.appendChild(all);

    var listEl = all.querySelector("#r-list");
    function drawList(q) {
      q = (q || "").trim().toLowerCase();
      var items = ST.runners.filter(function (r) {
        if (!q) return true;
        return (r.name || "").toLowerCase().indexOf(q) >= 0 ||
               (r.phone || "").replace(/-/g, "").indexOf(q.replace(/-/g, "")) >= 0 ||
               (r.code || "").toLowerCase().indexOf(q) >= 0;
      });
      listEl.innerHTML = items.length
        ? items.map(function (r) {
            return '<div class="person-row"><div style="flex:1; min-width:0;">' +
              '<div class="who"><span class="person-name">' + esc(r.name) + "</span>" +
              '<span class="who-code">' + esc(r.code || "—") + "</span>" +
              (r.dupName ? '<span class="dup-flag">ชื่อซ้ำ</span>' : "") + "</div>" +
              '<div class="person-sub">' + esc(r.phone || "ไม่มีเบอร์") + " · เช็คอิน " + r.count + " ครั้ง</div></div>" +
              '<button class="del-btn" data-del="' + esc(r.id) + '" data-name="' + esc(r.name) +
              '" data-count="' + r.count + '" aria-label="ลบ ' + esc(r.name) + '">' + ICON_TRASH + "</button></div>";
          }).join("")
        : '<div class="empty">ไม่พบใครที่ตรงกับ “' + esc(q) + '”</div>';

      listEl.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", async function () {
          var id = b.getAttribute("data-del");
          var nm = b.getAttribute("data-name");
          var ct = parseInt(b.getAttribute("data-count"), 10) || 0;
          var ok = await confirmBox({
            label: "ลบสมาชิก",
            title: "ลบ " + nm + " ?",
            body: "แต้มสะสม <b>" + ct + " ครั้ง</b> และประวัติการรับรางวัลของคนนี้จะถูกลบไปด้วย",
            warn: "ลบแล้วกู้คืนในแอปไม่ได้ — แต่ระบบจะบันทึกไว้ในชีต «Deleted» ว่าลบใครไปเมื่อไหร่",
            okText: "ลบเลย"
          });
          if (!ok) return;
          busy(b, true, "…");
          try {
            var res = await call("apiDeleteRunner", [staffPin, id]);
            toast("ลบ " + res.name + " แล้ว (" + res.removedCheckins + " ครั้ง)");
            await reloadStaff();
          } catch (e) { toast(e.message); busy(b, false); }
        });
      });
    }
    drawList("");
    all.querySelector("#r-search").addEventListener("input", function () { drawList(this.value); });

    /* ---------- ลิงก์ชีต ---------- */
    var log = document.createElement("div");
    log.className = "card";
    log.innerHTML = '<div class="label">ข้อมูลใน Google Sheet</div>' +
      '<p class="small muted" style="margin-top:8px; line-height:1.7;">ชีต <b>Checkins</b> และ <b>Redemptions</b> มีคอลัมน์ ชื่อ / เบอร์โทร / รหัสสมาชิก / ของรางวัล ให้อ่านได้เลย ไม่ต้องไล่เทียบรหัสเอง</p>' +
      '<div class="row-gap" style="margin-top:12px;">' +
      '<a class="btn btn-outline btn-sm" href="' + esc(ST.sheetUrl) + '" target="_blank" rel="noopener">เปิด Google Sheet</a>' +
      '<a class="btn btn-outline btn-sm" href="' + esc(ST.deletedUrl || ST.sheetUrl) + '" target="_blank" rel="noopener">ประวัติการลบ (' + (ST.deletedCount || 0) + ")</a></div>";
    body.appendChild(log);
  }

  /* ---------- แก้เช็คอิน: เพิ่มย้อนหลัง / ลบที่ผิด ----------
     QR ยังเข้มเหมือนเดิม (ปิดกิจกรรมแล้วสแกนไม่ได้) เพื่อกันมั่ว
     แต่ทีมงานมีทางแก้ให้คนที่ลืมสแกนจริงๆ และทุกครั้งถูกบันทึกไว้ในชีต   */

  function staffFix(body) {
    var pick = { runnerId: "", eventId: "" };

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="label">เพิ่มเช็คอินย้อนหลัง</div>' +
      '<p class="small muted" style="margin:8px 0 14px; line-height:1.7;">สำหรับคนที่มาร่วมจริงแต่ลืมสแกน — ใช้ได้แม้กิจกรรมปิดไปแล้ว</p>' +
      '<div class="field"><label>เลือกกิจกรรม</label><select id="fx-event"></select></div>' +
      '<div class="field"><label>ค้นหาสมาชิก (ชื่อ / เบอร์ / รหัส)</label>' +
      '<input id="fx-search" type="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์เพื่อค้นหา"></div>' +
      '<div id="fx-results"></div>' +
      '<div id="fx-chosen"></div>' +
      '<button class="btn btn-yellow" id="fx-add" disabled style="margin-top:12px;">เพิ่มเช็คอิน</button>' +
      '<div class="note" style="margin-top:12px;">ทุกครั้งที่เพิ่มเอง ชีตจะบันทึกคอลัมน์ <b>เพิ่มโดยทีมงาน = ใช่</b> ให้ตรวจย้อนหลังได้</div>';
    body.appendChild(card);

    var sel = card.querySelector("#fx-event");
    sel.innerHTML = '<option value="">— เลือก —</option>' + ST.events.map(function (e) {
      return '<option value="' + esc(e.id) + '">' + esc(e.name) + " · " + fmtDate(e.date) +
        (e.active ? "" : " (ปิดแล้ว)") + "</option>";
    }).join("");

    var results = card.querySelector("#fx-results");
    var chosen = card.querySelector("#fx-chosen");
    var addBtn = card.querySelector("#fx-add");

    function refreshBtn() {
      addBtn.disabled = !(pick.runnerId && pick.eventId);
    }
    function drawChosen() {
      var r = ST.runners.filter(function (x) { return x.id === pick.runnerId; })[0];
      chosen.innerHTML = r
        ? '<div class="person-row" style="border-top:1px solid var(--hairline);">' +
          '<div><div class="who"><span class="person-name">' + esc(r.name) + "</span>" +
          '<span class="who-code">' + esc(r.code || "—") + "</span></div>" +
          '<div class="person-sub">' + esc(r.phone) + "</div></div>" +
          '<button class="undo-btn" id="fx-clear">เปลี่ยน</button></div>'
        : "";
      var c = chosen.querySelector("#fx-clear");
      if (c) c.addEventListener("click", function () {
        pick.runnerId = ""; drawChosen(); refreshBtn();
        card.querySelector("#fx-search").value = ""; results.innerHTML = "";
      });
    }

    sel.addEventListener("change", function () { pick.eventId = sel.value; refreshBtn(); });

    card.querySelector("#fx-search").addEventListener("input", function () {
      var q = this.value.trim().toLowerCase();
      if (!q) { results.innerHTML = ""; return; }
      var hits = ST.runners.filter(function (r) {
        return (r.name || "").toLowerCase().indexOf(q) >= 0 ||
               (r.phone || "").replace(/-/g, "").indexOf(q.replace(/-/g, "")) >= 0 ||
               (r.code || "").toLowerCase().indexOf(q) >= 0;
      }).slice(0, 8);
      results.innerHTML = hits.length
        ? hits.map(function (r) {
            return '<div class="person-row"><div><div class="who">' +
              '<span class="person-name">' + esc(r.name) + "</span>" +
              '<span class="who-code">' + esc(r.code || "—") + "</span></div>" +
              '<div class="person-sub">' + esc(r.phone) + "</div></div>" +
              '<button class="btn btn-quiet btn-sm" data-pick="' + esc(r.id) + '">เลือก</button></div>';
          }).join("")
        : '<div class="empty">ไม่พบใคร</div>';
      results.querySelectorAll("[data-pick]").forEach(function (b) {
        b.addEventListener("click", function () {
          pick.runnerId = b.getAttribute("data-pick");
          results.innerHTML = "";
          card.querySelector("#fx-search").value = "";
          drawChosen(); refreshBtn();
        });
      });
    });

    addBtn.addEventListener("click", async function () {
      var r = ST.runners.filter(function (x) { return x.id === pick.runnerId; })[0];
      var e = ST.events.filter(function (x) { return x.id === pick.eventId; })[0];
      var ok = await confirmBox({
        label: "ยืนยัน",
        title: "เพิ่มเช็คอินย้อนหลัง?",
        body: "เพิ่มให้ <b>" + esc(r ? r.name : "") + " (" + esc(r ? r.code : "") + ")</b><br>ในกิจกรรม <b>" + esc(e ? e.name : "") + "</b>",
        warn: "ทำเมื่อแน่ใจว่าคนนี้มาร่วมจริง — ระบบจะบันทึกว่าทีมงานเป็นคนเพิ่ม",
        okText: "เพิ่มเลย"
      });
      if (!ok) return;
      busy(addBtn, true, "กำลังเพิ่ม…");
      try {
        var res = await call("apiManualCheckin", [staffPin, pick.runnerId, pick.eventId]);
        toast("เพิ่มให้ " + res.name + " แล้ว (รวม " + res.count + " ครั้ง)");
        pick.runnerId = "";
        await reloadStaff();
      } catch (err) { toast(err.message); busy(addBtn, false); }
    });

    /* ---------- ดู/ลบรายชื่อที่เช็คอินแล้ว ---------- */
    var listCard = document.createElement("div");
    listCard.className = "card";
    listCard.innerHTML = '<div class="label">รายชื่อที่เช็คอินแล้ว</div>' +
      '<div class="field" style="margin-top:12px;"><label>เลือกกิจกรรม</label><select id="fx-ev2"></select></div>' +
      '<div id="fx-list"><div class="empty">เลือกกิจกรรมเพื่อดูรายชื่อ</div></div>';
    body.appendChild(listCard);

    var sel2 = listCard.querySelector("#fx-ev2");
    sel2.innerHTML = '<option value="">— เลือก —</option>' + ST.events.map(function (e) {
      return '<option value="' + esc(e.id) + '">' + esc(e.name) + " · " + fmtDate(e.date) + "</option>";
    }).join("");

    var listEl = listCard.querySelector("#fx-list");
    async function loadList() {
      if (!sel2.value) { listEl.innerHTML = '<div class="empty">เลือกกิจกรรมเพื่อดูรายชื่อ</div>'; return; }
      listEl.innerHTML = '<div class="center" style="padding:20px;"><div class="spinner"></div></div>';
      try {
        var rowsIn = await call("apiEventCheckins", [staffPin, sel2.value]);
        listEl.innerHTML = rowsIn.length
          ? '<div class="label" style="margin:14px 0 4px;">ทั้งหมด ' + rowsIn.length + " คน</div>" +
            rowsIn.map(function (c) {
              return '<div class="person-row"><div style="flex:1; min-width:0;">' +
                '<div class="who"><span class="person-name">' + esc(c.name) + "</span>" +
                '<span class="who-code">' + esc(c.code || "—") + "</span>" +
                (c.manual ? '<span class="dup-flag">เพิ่มเอง</span>' : "") + "</div>" +
                '<div class="person-sub">' + esc(c.when) + "</div></div>" +
                '<button class="undo-btn" data-rm="' + esc(c.runnerId) + '">ลบ</button></div>';
            }).join("")
          : '<div class="empty">ยังไม่มีใครเช็คอินกิจกรรมนี้</div>';

        listEl.querySelectorAll("[data-rm]").forEach(function (b) {
          b.addEventListener("click", async function () {
            var ok = await confirmBox({
              label: "ลบเช็คอิน", title: "ลบรายการนี้?",
              body: "แต้มของคนนี้จะลดลง 1 ครั้ง",
              okText: "ลบ"
            });
            if (!ok) return;
            busy(b, true, "…");
            try {
              await call("apiRemoveCheckin", [staffPin, b.getAttribute("data-rm"), sel2.value]);
              toast("ลบแล้ว");
              await loadList();
            } catch (e2) { toast(e2.message); busy(b, false); }
          });
        });
      } catch (e) { listEl.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; }
    }
    sel2.addEventListener("change", loadList);
  }

  /* ===================== boot ===================== */

  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-nav]");
    if (!t) return;
    var to = t.getAttribute("data-nav");
    if (to === "home") {
      V.screen = "home"; V.present = null; BOOT.eventCode = "";
      refresh();
    } else if (to === "scan") {
      V.screen = "scan"; V.present = null; BOOT.eventCode = "";
      render();
    } else if (to === "profile") {
      V.screen = "profile"; V.present = null; BOOT.eventCode = "";
      render();
    } else if (to === "staff") {
      V.screen = "staff";
      if (staffPin) {
        // โหลดใหม่ทุกครั้งที่กลับเข้าหน้าทีมงาน — ไม่งั้นจะเห็นรายการค้างของเก่า
        // (เช่น เพิ่งมีคนเช็คอินครบ แต่รายการรอแจกยังไม่ขึ้น)
        if (!ST) showLoading();
        call("apiStaffState", [staffPin]).then(function (s) { ST = s; render(); })
          .catch(function () { setPin(""); ST = null; render(); });
      } else { ST = null; render(); }
    }
  });

  async function refresh() {
    try {
      S = await call("apiRunnerState", [myId(), BOOT.eventCode]);
      render();
    } catch (e) {
      app.innerHTML = '<div class="content"><div class="card err">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) +
        '<br><br>ลองรีเฟรชหน้าอีกครั้ง</div></div>';
    }
  }

      '<div class="content"><div class="card">' +
      '<div class="label">ยังตั้งค่าไม่ครบ</div>' +
      '<h2 style="font-family:var(--font-display); font-size:24px; text-transform:uppercase; margin-top:8px; line-height:1.05;">' +

      '<p class="small" style="margin-top:12px; line-height:1.75;">' +
      'หน้าเว็บนี้พร้อมแล้ว แต่ยังไม่รู้ว่าจะไปเอาข้อมูลจากที่ไหน ' +
      'ต้องบอกมันด้วยลิงก์ Apps Script ของคุณ</p>' +
